# A development stack to emulate the Lakehouse. This is intended for local development only.
# See ./README.md

# image versions
x-keycloak-image: &keycloak-image quay.io/keycloak/keycloak:26.3
x-openfga-image: &openfga-image openfga/openfga:v1.11.2
x-lakekeeper-image: &lakekeeper-image quay.io/lakekeeper/catalog:v0.11.1
x-minio-image: &minio-image quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
x-postgres-image: &postgres-image postgres:18-bookworm
x-redis-image: &redis-image redis:8.4-bookworm
x-superset-image: &superset-image ghcr.io/isisneutronmuon/analytics-data-platform-superset:a4f0e8011f34785d759269dceedfa2693db81c19
x-traefik-image: &traefik-image traefik:v3.5.3
x-trino-image: &trino-image trinodb/trino:477

# environment
x-env-file: &env-file
  - path: ./env-local
    required: true

# network
x-networks: &local-networks
  - local-lakehouse_net

# certs
x-mkcert-depends: &mkcert-depends
  mkcert:
    condition: service_completed_successfully
x-certs-volume: &certs-volume "mkcert_data:/certs"

# superset options
x-superset-user: &superset-user root
x-superset-depends-on: &superset-depends-on
  superset-redis:
    condition: service_started
  shared-database-bootstrap:
    condition: service_completed_successfully
x-superset-volumes: &superset-volumes
  - ./superset/docker/docker-init.sh:/app/docker/docker-init.sh:ro
  - ./superset/docker/docker-bootstrap-cert.sh:/app/docker/docker-bootstrap-cert.sh:ro
  - ./superset/docker/requirements-local.txt:/app/docker/requirements-local.txt:ro
  - ./superset/docker/pythonpath:/app/docker/pythonpath:ro
  - *certs-volume

x-airflow-common:
  &airflow-common
  # In order to add custom dependencies or upgrade provider distributions you can use your extended image.
  # Comment the image line, place your Dockerfile in the directory where you placed the docker-compose.yaml
  # and uncomment the "build" line below, Then run `docker-compose build` to build the images.
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.0}
  # build: .
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    #_PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-pyiceberg[pyiceberg-core]==0.11.1 s3fs==2026.1.0}
    # The following line can be used to set a custom config file, stored in the local config folder
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    PYICEBERG_HOME: /opt/airflow/config
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    # - ${AIRFLOW_PROJ_DIR:-.}/config/.pyiceberg.yaml:/opt/airflow/.pyiceberg.yaml:ro
    - ${AIRFLOW_PROJ_DIR:-.}/../..:/opt/analytics-data-platform
  networks: *local-networks
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  #########################################################
  # Ingress
  #########################################################
  mkcert:
    container_name: local-lakehouse-mkcert
    image: alpine/mkcert
    entrypoint:
      - /bin/sh
      - -c
      - |
        certfile=/certs/localdev.pem
        if [ ! -f "$$certfile" ]; then
          echo "$$certfile not found. Creating new CA and certificate."
          cd /certs || exit 1
          mkcert -cert-file "$$certfile" -key-file localdev-key.pem localhost 127.0.0.1 ::1
          cp "$$(mkcert -CAROOT)"/* .
        else
          echo "$$certfile exists, skipping certificate creation."
        fi
    restart: "no"
    volumes:
      - *certs-volume
    networks: *local-networks

  adp-router:
    container_name: local-lakehouse-traefik
    image: *traefik-image
    env_file: *env-file
    depends_on: *mkcert-depends
    healthcheck:
      test: ["CMD-SHELL", "traefik healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    ports:
      - "50080:50080"
      - "59000:59000" # MinIO api
      - "58443:8443" # TLS entrypoint for Trino (cannot run on non-root path prefix or without https with auth enabled)
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml"
      - "./traefik/traefik-dynamic.yml:/etc/traefik/traefik-dynamic.yml"
      - *certs-volume
    networks: *local-networks

  #########################################################
  # Database shared by all services
  # Do not do this in production!
  #########################################################
  shared-database:
    container_name: local-lakehouse-shared-database
    image: *postgres-image
    env_file: *env-file
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -p 5432"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 10s
    ports:
      # Open the port for easy access to viewing the database
      - "55432:5432"
    volumes:
      - "shared_database_data:/var/lib/postgresql"
    networks: *local-networks

  shared-database-bootstrap:
    container_name: local-lakehouse-shared-database-bootstrap
    image: *postgres-image
    env_file: *env-file
    restart: "no"
    depends_on:
      shared-database:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        create_db_if_not_exists() {
          psql -v ON_ERROR_STOP=1 --host=shared-database --username="$$ADP_SUPERUSER" <<-EOSQL
            SELECT 'CREATE DATABASE $1' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$1')\\gexec
        EOSQL
        }
        rename_schema() {
          psql -v ON_ERROR_STOP=1 --host=shared-database --username="$$ADP_SUPERUSER" $1 <<-EOSQL
            SELECT 'ALTER SCHEMA $2 RENAME TO $3' WHERE NOT EXISTS (select schema_name from information_schema.schemata WHERE schema_name = '$3')\\gexec
        EOSQL
        }
        create_db_if_not_exists $$SHARED_DB__OPENFGA_DB_NAME
        create_db_if_not_exists $$SHARED_DB__LAKEKEEPER_DB_NAME
        create_db_if_not_exists $$SHARED_DB__SUPERSET_DB_NAME
        rename_schema $$SUPERSET_DB_NAME public $$SUPERSET_DB_SCHEMA_NAME
    networks: *local-networks

  #########################################################
  # Keycloak identity provider
  #########################################################
  keycloak:
    container_name: local-lakehouse-keycloak
    image: *keycloak-image
    env_file: *env-file
    volumes:
      - keycloak_data:/opt/keycloak/data
      - "./healthcheck-localhost.sh:/usr/local/bin/healthcheck-localhost.sh:ro"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "healthcheck-localhost.sh 8080 $$KC_HTTP_RELATIVE_PATH/realms/master/.well-known/openid-configuration jwks_uri",
        ]
      start_period: 20s
      start_interval: 2s
      interval: 15s
      timeout: 30s
      retries: 5
    command:
      [
        "start-dev",
        "--metrics-enabled=true",
        "--health-enabled=true",
        "--features=token-exchange",
        "--hostname-debug=true",
        "--proxy-headers=xforwarded",
        "--verbose",
        "--log-level=INFO",
      ]
    networks: *local-networks

  keycloak-bootstrap:
    container_name: local-lakehouse-keycloak-bootstrap
    build:
      context: keycloak
      dockerfile: Dockerfile-kcadm.dockerfile
      args:
        base: *keycloak-image
    env_file: *env-file
    entrypoint:
      - /bin/sh
      - -c
      - "sleep 1; /opt/keycloak/bootstrap.sh http://keycloak:8080/auth"
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    networks: *local-networks
    volumes:
      - "./keycloak/bootstrap.sh:/opt/keycloak/bootstrap.sh:ro"

  #########################################################
  # MinIO - Object store emulating the Ceph object store
  # in SCD. This is exposed directly rather than through traefik
  # as the service needs to be accessible for clients such as
  # PyIcberg.
  # Service name needs to match the endpoint value in bootstrap-warehouse.json
  #########################################################
  minio:
    container_name: local-lakehouse-minio
    image: *minio-image
    env_file: *env-file
    # Match ports on host & container to use the same port inside and outside the container
    # network
    command:
      ["server", "/data", "--address", ":59000", "--console-address", ":59001"]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck-localhost.sh 59000 /minio/health/live"]
      start_period: 10s
      interval: 30s
      timeout: 30s
      retries: 3
    volumes:
      - "./healthcheck-localhost.sh:/usr/local/bin/healthcheck-localhost.sh:ro"
      - "minio_data:/data"
    networks: *local-networks

  #########################################################
  # OpenFGA - Permissioning
  #########################################################
  openfga-migrate:
    container_name: local-lakehouse-openfga-migrate
    image: *openfga-image
    env_file: *env-file
    command: migrate
    depends_on:
      shared-database-bootstrap:
        condition: service_completed_successfully
    networks: *local-networks

  openfga:
    container_name: local-lakehouse-openfga
    image: *openfga-image
    env_file: *env-file
    command: run
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    networks: *local-networks
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 10s
      timeout: 30s
      retries: 3

  #########################################################
  # Lakekeeper - Iceberg REST catalog
  #########################################################
  lakekeeper:
    container_name: local-lakehouse-lakekeeper
    image: *lakekeeper-image
    env_file: *env-file
    environment:
      - SSL_CERT_FILE=/certs/rootCA.pem
      - RUST_LOG=info,lakekeeper=${LAKEKEEPER_LOG_LEVEL:-info},lakekeeper_bin=${LAKEKEEPER_LOG_LEVEL:-info},iceberg_ext=${LAKEKEEPER_LOG_LEVEL:-info}
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      start_period: 5s
      interval: 30s
      timeout: 30s
      retries: 3
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      adp-router:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      shared-database-bootstrap:
        condition: service_completed_successfully
    volumes:
      - *certs-volume
    networks: *local-networks

  lakekeeper-migrate:
    container_name: local-lakehouse-lakekeeper-migrate
    image: *lakekeeper-image
    env_file: *env-file
    restart: "no"
    command: ["migrate"]
    depends_on:
      shared-database-bootstrap:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
    networks: *local-networks

  lakekeeper-bootstrap:
    container_name: local-lakehouse-lakekeeper-bootstrap
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    env_file: *env-file
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        for name in "$${WAREHOUSE_NAME}_landing" "$${WAREHOUSE_NAME}"; do \
          uv run /opt/work/bootstrap-warehouse.py \
            --lakekeeper-project-name "$$KC_REALM_NAME" \
            --keycloak-url "$$KEYCLOAK_URL_INTERNAL" \
            --keycloak-admin-credentials "$$KC_BOOTSTRAP_ADMIN_USERNAME:$$KC_BOOTSTRAP_ADMIN_PASSWORD" \
            --keycloak-user-realm "$$KC_REALM_NAME" \
            --bootstrap-credentials "machine-infra:s3cr3t" \
            --token-scope lakekeeper \
            --server-admin "$$ADP_SUPERUSER" \
            --log-level=DEBUG \
            --warehouse-json-file "/opt/work/warehouses/$$name.json" \
            "http://lakekeeper:8181"; \
        done
    restart: "no"
    depends_on:
      lakekeeper:
        condition: service_healthy
    volumes:
      - "../ansible/roles/lakekeeper/files/bootstrap-warehouse.py:/opt/work/bootstrap-warehouse.py"
      - "./warehouses/lakekeeper:/opt/work/warehouses:ro"
      - *certs-volume
    networks: *local-networks

  #########################################################
  # Marimo notebooks
  #########################################################
  marimo:
    container_name: local-lakehouse-marimo
    build:
      context: marimo
    env_file: *env-file
    healthcheck:
      test: ["CMD-SHELL", "healthcheck-localhost.sh 8080 /health healthy"]
      start_period: 5s
      interval: 30s
      timeout: 30s
    networks: *local-networks
    volumes:
      - ./marimo/notebooks:/home/nbuser/notebooks
      - "./healthcheck-localhost.sh:/usr/local/bin/healthcheck-localhost.sh:ro"
  #########################################################
  # Trino query engine
  #########################################################

  trino:
    container_name: local-lakehouse-trino
    image: *trino-image
    env_file: *env-file
    depends_on:
      keycloak:
        condition: service_healthy
      adp-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:8080/v1/status"]
      start_period: 10s
      interval: 30s
      timeout: 30s
      retries: 2
    volumes:
      - "./trino/etc:/etc/trino"
      - "./warehouses/trino:/etc/trino/catalog"
      - *certs-volume
    networks: *local-networks

  #########################################################
  # Superset BI tool
  #########################################################

  superset-redis:
    profiles:
      - superset
    container_name: local-lakehouse-superset-redis
    env_file: *env-file
    image: *redis-image
    restart: unless-stopped
    volumes:
      - shared_redis_data:/data
    networks: *local-networks

  superset-app:
    profiles:
      - superset
    container_name: local-lakehouse-superset-app
    env_file: *env-file
    image: *superset-image
    command: ["/app/docker/docker-bootstrap-cert.sh", "app-gunicorn"]
    user: *superset-user
    restart: unless-stopped
    depends_on:
      <<: *superset-depends-on
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    networks: *local-networks

  superset-init:
    profiles:
      - superset
    container_name: local-lakehouse-superset-init
    env_file: *env-file
    image: *superset-image
    command: ["/app/docker/docker-init.sh"]
    depends_on:
      <<: *superset-depends-on
      shared-database:
        condition: service_healthy
    user: *superset-user
    volumes: *superset-volumes
    networks: *local-networks
    healthcheck:
      disable: true

  superset-worker:
    profiles:
      - superset-worker
    container_name: local-lakehouse-superset-worker
    env_file: *env-file
    image: *superset-image
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: unless-stopped
    depends_on:
      <<: *superset-depends-on
      superset-app:
        condition: service_healthy
    user: *superset-user
    volumes: *superset-volumes
    networks: *local-networks
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]
      interval: 15s

  superset-worker-beat:
    profiles:
      - superset-worker
    container_name: local-lakehouse-superset-worker-beat
    env_file: *env-file
    image: *superset-image
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    restart: unless-stopped
    depends_on:
      <<: *superset-depends-on
      superset-app:
        condition: service_healthy
    user: *superset-user
    volumes: *superset-volumes
    networks: *local-networks
    healthcheck:
      disable: true

  #########################################################
  # Apache Airflow ELT Orchestration
  #########################################################

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks: *local-networks

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks: *local-networks

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      # yamllint disable rule:line-length
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID:-50000}:0"
        echo
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID:-50000}:0"
        echo
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
networks:
  local-lakehouse_net:
    name: local-lakehouse-network

volumes:
  mkcert_data:
    name: local-lakehouse_mkcert_data
  keycloak_data:
    name: local-lakehouse_keycloak_data
  marimo_data:
    name: local-lakehouse_marimo_data
  minio_data:
    name: local-lakehouse_minio_data
  shared_database_data:
    name: local-lakehouse_shared_database_data
  shared_redis_data:
    name: local-lakehouse_shared_redis_data
  postgres-db-volume:

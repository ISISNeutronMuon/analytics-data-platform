# A development stack to emulate the Lakehouse. This is intended for local development only.
# See ./README.md

services:
  #########################################################
  # Ingress
  #
  # We make a certificate so that Traefik can be configured
  # with an enpoints with TLS-termination enabled.
  # This is primarily for Trino that requires the use of
  # HTTPS when authentication is enabled.
  #########################################################
  mkcert:
    container_name: local-lakehouse-mkcert
    image: alpine/mkcert
    entrypoint:
      - /bin/sh
      - -c
      - |
        certfile=/certs/localdev.pem
        if [ ! -f "$$certfile" ]; then
          echo "$$certfile not found. Creating new CA and certificate."
          cd /certs || exit 1
          mkcert -cert-file "$$certfile" -key-file localdev-key.pem localhost 127.0.0.1 ::1
          cp "$$(mkcert -CAROOT)"/* .
        else
          echo "$$certfile exists, skipping certificate creation."
        fi
    restart: "no"
    networks: &networks-common
      - local-lakehouse_net
    volumes:
      - "mkcert_data:/certs"

  adp-router:
    container_name: local-lakehouse-traefik
    image: traefik:v3.7.13
    env_file: &env_file-common
      - path: ./env-local
        required: true
    depends_on:
      mkcert:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "traefik healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    ports:
      - "50080:50080" # Web entry point
      - "59000:59000" # S3 entrypoint
      - "58443:8443" # TLS entrypoint for Trino (cannot run on non-root path prefix or without https with auth enabled)
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml"
      - "./traefik/traefik-dynamic.yml:/etc/traefik/traefik-dynamic.yml"
      - "mkcert_data:/certs"
    networks: *networks-common

  #########################################################
  # Database shared by all services
  # Do not do this in production!
  #########################################################
  postgres-shared:
    container_name: local-lakehouse-postgres-shared
    image: postgres:18-trixie
    env_file: *env_file-common
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -p 5432"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 10s
    networks: *networks-common
    volumes:
      - "postgres-shared_data:/var/lib/postgresql"
      - "./postgres/initdb.d:/docker-entrypoint-initdb.d:ro"

  #########################################################
  # Keycloak identity provider
  #########################################################
  keycloak:
    container_name: local-lakehouse-keycloak
    image: &keycloak_image quay.io/keycloak/keycloak:26.7
    env_file: *env_file-common
    command:
      [
        "start-dev",
        "--metrics-enabled=true",
        "--health-enabled=true",
        "--features=token-exchange",
        "--hostname-debug=true",
        "--proxy-headers=xforwarded",
        "--log-level=ERROR",
      ]
    volumes:
      - keycloak_data:/opt/keycloak/data
      - "./request-get.sh:/usr/local/bin/request-get.sh:ro"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "request-get.sh 8080 $$KC_HTTP_RELATIVE_PATH/realms/master/.well-known/openid-configuration jwks_uri",
        ]
      start_period: 20s
      start_interval: 5s
      interval: 15s
      timeout: 30s
      retries: 5
    networks: *networks-common

  keycloak-bootstrap:
    container_name: local-lakehouse-keycloak-bootstrap
    build:
      context: keycloak
      dockerfile: Dockerfile-kcadm.dockerfile
      args:
        base: *keycloak_image
    env_file: *env_file-common
    entrypoint:
      - /bin/sh
      - -c
      - "sleep 1; /opt/keycloak/bootstrap.sh http://keycloak:8080/auth"
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    networks: *networks-common
    volumes:
      - "./keycloak/bootstrap.sh:/opt/keycloak/bootstrap.sh:ro"

  #########################################################
  # SeaweedFS - Object store emulating the Ceph object store.
  #########################################################
  seaweedfs:
    container_name: local-lakehouse-seaweedfs
    image: chrislusf/seaweedfs:4.46
    env_file: *env_file-common
    # Match ports on host & container to use the same port inside and outside the container
    # network
    command:
      - "mini"
      - "-dir=/data"
      - "-s3.iam.config=/etc/seaweedfs/iam.json"
      - "-s3.port=59000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:59000/status || exit 1"]
      start_period: 15s
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - "./seaweedfs/s3-iam-config.json:/etc/seaweedfs/iam.json:ro"
      - "seaweedfs_data:/data"
    networks: *networks-common

  #########################################################
  # OpenFGA - Permissioning
  #########################################################
  openfga-migrate:
    container_name: local-lakehouse-openfga-migrate
    image: &openfga-image openfga/openfga:v1.20.0
    env_file: *env_file-common
    command: migrate
    depends_on:
      postgres-shared:
        condition: service_healthy
    networks: *networks-common

  openfga:
    container_name: local-lakehouse-openfga
    image: *openfga-image
    env_file: *env_file-common
    command: run
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    networks: *networks-common
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 10s
      timeout: 30s
      retries: 3

  #########################################################
  # Lakekeeper - Iceberg REST catalog
  #########################################################
  lakekeeper:
    container_name: local-lakehouse-lakekeeper
    image: &lakekeeper-image quay.io/lakekeeper/catalog:v0.13.4
    env_file: *env_file-common
    environment:
      #      - SSL_CERT_FILE=/certs/rootCA.pem
      - RUST_LOG=info,lakekeeper=${LAKEKEEPER_LOG_LEVEL:-info},lakekeeper_bin=${LAKEKEEPER_LOG_LEVEL:-info},iceberg_ext=${LAKEKEEPER_LOG_LEVEL:-info}
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      start_period: 5s
      interval: 30s
      timeout: 30s
      retries: 3
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      adp-router:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      postgres-shared:
        condition: service_started
    networks: *networks-common

  lakekeeper-migrate:
    container_name: local-lakehouse-lakekeeper-migrate
    image: *lakekeeper-image
    env_file: *env_file-common
    restart: "no"
    command: ["migrate"]
    depends_on:
      openfga:
        condition: service_healthy
    networks: *networks-common

  #########################################################
  # Warehouse bootstrap
  #
  # Creates Lakekeeper warehouses and the matching Trino
  # Iceberg catalogs. Lakekeeper warehouse config is
  # generated into a temporary JSON file at runtime and
  # Trino catalogs are created dynamically via the Trino
  # REST API (no static config files are stored under
  # ./warehouses/).
  #########################################################
  warehouse-bootstrap:
    container_name: local-lakehouse-warehouse-bootstrap
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    env_file: *env_file-common
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        for base in $${WAREHOUSE_NAMES}; do
          for name in "$${base}_landing" "$${base}"; do
            # Generate the Lakekeeper warehouse config to a temporary file.
            uv run /opt/work/generate-warehouse-json.py "$$name" > "/tmp/$$name.json"
            uv run /opt/work/bootstrap-warehouse.py \
              --lakekeeper-project-name "$$KC_REALM_NAME" \
              --keycloak-url "$$KEYCLOAK_URL_INTERNAL" \
              --keycloak-admin-credentials "$$KC_BOOTSTRAP_ADMIN_USERNAME:$$KC_BOOTSTRAP_ADMIN_PASSWORD" \
              --keycloak-user-realm "$$KC_REALM_NAME" \
              --bootstrap-credentials "machine-infra:s3cr3t" \
              --token-scope lakekeeper \
              --server-admin "$$ADMIN_USER" \
              --log-level=DEBUG \
              --warehouse-json-file "/tmp/$$name.json" \
              "http://lakekeeper:8181"
            # Create the matching Trino Iceberg catalog dynamically.
            uv run /opt/work/create-trino-catalog.py "$$name"
          done
        done
    restart: "no"
    depends_on:
      lakekeeper:
        condition: service_healthy
      trino:
        condition: service_healthy
    volumes:
      - "../ansible/roles/lakekeeper/files/bootstrap-warehouse.py:/opt/work/bootstrap-warehouse.py"
      - "./generate-warehouse-json.py:/opt/work/generate-warehouse-json.py:ro"
      - "./create-trino-catalog.py:/opt/work/create-trino-catalog.py:ro"
    networks: *networks-common

  #########################################################
  # Shared Redis cache
  #########################################################
  redis-shared:
    container_name: local-lakehouse-redis-shared
    env_file: *env_file-common
    image: redis:8.4-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: unless-stopped
    volumes:
      - shared_redis_data:/data
    networks: *networks-common

  #########################################################
  # Trino query engine
  #########################################################
  trino:
    container_name: local-lakehouse-trino
    image: trinodb/trino:483
    env_file: *env_file-common
    depends_on:
      keycloak:
        condition: service_healthy
      adp-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:8080/v1/status"]
      start_period: 10s
      interval: 30s
      timeout: 30s
      retries: 2
    volumes:
      - "./trino/etc:/etc/trino"
      # Persist the node data dir so dynamically created catalogs
      # (catalog.store=file) survive container recreation.
      - "trino_data:/data/trino"
    networks: *networks-common

networks:
  local-lakehouse_net:
    name: local-lakehouse-network

volumes:
  mkcert_data:
    name: local-lakehouse_mkcert_data
  postgres-shared_data:
    name: local-lakehouse_postgres_data
  keycloak_data:
    name: local-lakehouse_keycloak_data
  shared_redis_data:
    name: local-lakehouse_redis_data
  seaweedfs_data:
    name: local-lakehouse_seaweedfs_data
  trino_data:
    name: local-lakehouse_trino_data

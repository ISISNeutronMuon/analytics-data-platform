tls:
  certificates:
    - certFile: /certs/localdev.pem
      keyFile: /certs/localdev-key.pem

http:
  routers:
    #
    # Https: Trino requires https when authentication is enabled
    #
    trino:
      entryPoints: trinosecure
      rule: PathPrefix(`/`)
      service: trino
      tls: {}

    #
    # Http
    #
    airflow:
      entryPoints: web
      rule: PathPrefix(`/airflow`)
      service: airflow

    airflow-flower:
      entryPoints: web
      rule: PathPrefix(`/airflow-flower`)
      service: airflow-flower

    keycloak:
      entryPoints: web
      rule: PathPrefix(`{{ env "KC_HTTP_RELATIVE_PATH" }}`)
      service: keycloak

    lakekeeper:
      entryPoints: web
      rule: PathPrefix(`/iceberg`)
      middlewares:
        - lakekeeper-strip-prefix
      service: lakekeeper

    openfga:
      entryPoints: web
      rule: PathPrefix(`/authz`)
      service: openfga
      middlewares:
        - openfga-strip-prefix

    marimo:
      entryPoints: web
      rule: PathPrefix(`/marimo`)
      service: marimo
      middlewares:
        - marimo-strip-prefix

    s3api:
      entryPoints: s3api
      rule: PathPrefix(`/`)
      service: s3api

    superset:
      entryPoints: web
      rule: PathPrefix(`{{ env "SUPERSET_APP_ROOT" }}`)
      service: superset

    traefik:
      entryPoints: web
      rule: PathPrefix(`/internal/traefik`) || HeaderRegexp(`Referer`, `/internal/traefik`)
      service: api@internal
      middlewares:
        - traefik-strip-prefix

  middlewares:
    lakekeeper-strip-prefix:
      stripPrefix:
        prefixes:
          - "/iceberg"
    marimo-strip-prefix:
      stripPrefix:
        prefixes:
          - "/marimo"
    openfga-strip-prefix:
      stripPrefix:
        prefixes:
          - "/authz"
    traefik-strip-prefix:
      stripPrefix:
        prefixes:
          - "/internal/traefik"

  services:
    airflow:
      loadBalancer:
        servers:
          - url: "http://airflow-apiserver:8080"
    airflow-flower:
      loadBalancer:
        servers:
          - url: "http://flower:5555"
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"
    marimo:
      loadBalancer:
        servers:
          - url: "http://marimo:8080"
    s3api:
      loadBalancer:
        servers:
          - url: "http://seaweedfs:59000"
    lakekeeper:
      loadBalancer:
        servers:
          - url: "http://lakekeeper:8181"
    openfga:
      loadBalancer:
        servers:
          - url: "http://openfga:8080"
    trino:
      loadBalancer:
        servers:
          - url: "http://trino:8080"
    superset:
      loadBalancer:
        servers:
          - url: "http://superset-app:8088"

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.warehouse=${ENV:WAREHOUSE_NAME}_landing
iceberg.rest-catalog.uri=http://${ENV:ROUTER_HOSTNAME_INTERNAL}:${ENV:ROUTER_PORT_HTTP}/iceberg/catalog
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.server-uri=${ENV:KEYCLOAK_REALM_INTERNAL}/protocol/openid-connect/token
iceberg.rest-catalog.oauth2.credential=machine-infra:s3cr3t
iceberg.rest-catalog.oauth2.scope=lakekeeper

# Our local S3 implementation has STS enabled but our production S3 doesn't
# so we keep vended credentials off and provide the S3 access credentials
# here to mimic prod
fs.native-s3.enabled=true
s3.endpoint=http://${ENV:ROUTER_HOSTNAME_INTERNAL}:59000
s3.region=local-01
s3.path-style-access=true
s3.aws-access-key=${ENV:ADP_SUPERUSER}
s3.aws-secret-key=${ENV:ADP_SUPERUSER_PASS}

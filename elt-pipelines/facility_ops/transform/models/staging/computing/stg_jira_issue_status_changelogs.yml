models:
  - name: stg_jira_issue_status_changelogs
    description: >
      Get length of time an issue spends in each status
    columns:
      - name: issue_key
        data_tests:
        - not_null
      - name: from_status
        data_tests:
        - not_null
      - name: to_status
        data_tests:
        - not_null
      - name: changed_at
        data_tests:
        - not_null
